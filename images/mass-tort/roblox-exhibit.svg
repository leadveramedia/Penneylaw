<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520">
  <!-- Hero art for roblox-child-exploitation-lawsuit.html (desktop, under the headline). A private
       message log, annotated like an exhibit, with every message redacted: the pattern the page's
       escalation diagram describes (first contact in a game, then moved to another app), shown
       without showing any of it. No people, no game imagery, no platform names or marks.
       SVG used as an image can't load the page's web fonts, so text uses Arial. -->
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- message window -->
    <g fill="none" stroke="#A2DCF5" stroke-width="2" opacity=".5">
      <rect x="30" y="20" width="236" height="470" rx="14"/>
      <path d="M30 70h236"/>
    </g>
    <circle cx="58" cy="45" r="12" fill="none" stroke="#A2DCF5" stroke-width="1.5" opacity=".55"/>
    <rect x="80" y="38" width="86" height="14" rx="2" fill="#A2DCF5" opacity=".55"/>

    <text x="148" y="96" font-size="10" fill="#A2DCF5" opacity=".6" text-anchor="middle">Friend request accepted</text>

    <!-- messages: incoming on the left, every one redacted -->
    <g fill="#A2DCF5">
      <rect x="44" y="110" width="150" height="34" rx="10" opacity=".12"/>
      <rect x="54" y="121" width="110" height="12" rx="2" opacity=".5"/>
      <rect x="132" y="156" width="120" height="28" rx="10" opacity=".08"/>
      <rect x="142" y="164" width="70" height="12" rx="2" opacity=".35"/>
      <rect x="44" y="210" width="170" height="44" rx="10" opacity=".12"/>
      <rect x="54" y="220" width="136" height="10" rx="2" opacity=".5"/>
      <rect x="54" y="236" width="90" height="10" rx="2" opacity=".5"/>
      <rect x="44" y="286" width="160" height="34" rx="10" opacity=".12"/>
      <rect x="54" y="297" width="124" height="12" rx="2" opacity=".5"/>
      <rect x="44" y="352" width="176" height="44" rx="10" opacity=".12"/>
      <rect x="54" y="362" width="140" height="10" rx="2" opacity=".5"/>
      <rect x="54" y="378" width="100" height="10" rx="2" opacity=".5"/>
    </g>
    <g font-size="9" fill="#A2DCF5" opacity=".65">
      <text x="44" y="200">9:14 PM</text>
      <text x="44" y="276">11:52 PM</text>
      <text x="44" y="342">1:07 AM</text>
    </g>

    <!-- link out to another app -->
    <rect x="44" y="414" width="196" height="54" rx="10" fill="none" stroke="#A2DCF5" stroke-width="1.5" opacity=".55"/>
    <path d="M60 436l6-6a6 6 0 0 1 8 8l-4 4M74 446l-6 6a6 6 0 0 1-8-8l4-4M64 446l8-8" fill="none" stroke="#A2DCF5" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
    <text x="88" y="436" font-size="10" fill="#A2DCF5" opacity=".75">Add me on another app</text>
    <rect x="88" y="446" width="120" height="10" rx="2" fill="#A2DCF5" opacity=".5"/>

    <!-- callouts -->
    <g fill="none" stroke="#A2DCF5" stroke-width="1.25" opacity=".5">
      <path d="M166 45H330"/>
      <path d="M214 232L266 232 330 150"/>
      <path d="M90 342L266 342 330 260"/>
      <path d="M240 441H330"/>
    </g>
    <g fill="#A2DCF5" opacity=".75">
      <circle cx="166" cy="45" r="3"/><circle cx="214" cy="232" r="3"/>
      <circle cx="90" cy="342" r="3"/><circle cx="240" cy="441" r="3"/>
    </g>
    <g fill="#A2DCF5">
      <text x="338" y="43" font-size="12" font-weight="700" letter-spacing="1.5">PRIVATE MESSAGES</text>
      <text x="338" y="59" font-size="11" opacity=".7">From someone met in a game</text>
      <text x="338" y="148" font-size="12" font-weight="700" letter-spacing="1.5">CONTENT REDACTED</text>
      <text x="338" y="164" font-size="11" opacity=".7">You will not be asked to write it down</text>
      <text x="338" y="258" font-size="12" font-weight="700" letter-spacing="1.5">LATE-NIGHT CONTACT</text>
      <text x="338" y="274" font-size="11" opacity=".7">Later and later each night</text>
      <text x="338" y="439" font-size="12" font-weight="700" letter-spacing="1.5">MOVED OFF-PLATFORM</text>
      <text x="338" y="455" font-size="11" opacity=".7">Asked to continue somewhere else</text>
    </g>

    <!-- exhibit tag -->
    <rect x="338" y="330" width="128" height="34" rx="3" fill="none" stroke="#A2DCF5" stroke-width="1.5" opacity=".55"/>
    <text x="402" y="352" font-size="13" font-weight="700" letter-spacing="4" text-anchor="middle" fill="#A2DCF5" opacity=".7">EXHIBIT</text>
  </g>
</svg>
