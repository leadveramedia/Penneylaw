<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520">
  <!-- Hero art for social-media-addiction-lawsuit.html (desktop, under the headline). A generic
       feed annotated like an exhibit: the design features the litigation is about, named plainly.
       No platform names or marks. Labels describe each feature; they make no claim about intent.
       SVG used as an image can't load the page's web fonts, so text uses Arial. -->
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- phone -->
    <g fill="none" stroke="#A2DCF5" stroke-width="2" opacity=".55">
      <rect x="30" y="20" width="220" height="440" rx="28"/>
      <path d="M118 34h44"/>
    </g>
    <text x="52" y="56" font-size="11" fill="#A2DCF5" opacity=".8">2:47 AM</text>
    <rect x="206" y="47" width="20" height="9" rx="2" fill="none" stroke="#A2DCF5" stroke-width="1.5" opacity=".7"/>
    <rect x="208" y="49" width="4" height="5" fill="#A2DCF5" opacity=".7"/>

    <!-- notification banner -->
    <rect x="44" y="66" width="192" height="40" rx="8" fill="#A2DCF5" opacity=".13"/>
    <rect x="52" y="74" width="24" height="24" rx="5" fill="none" stroke="#A2DCF5" stroke-width="1.5" opacity=".6"/>
    <text x="84" y="84" font-size="11" fill="#A2DCF5" opacity=".85">37 new notifications</text>
    <path d="M84 94h96" stroke="#A2DCF5" stroke-width="3" stroke-linecap="round" opacity=".3"/>

    <!-- streak -->
    <rect x="44" y="116" width="104" height="22" rx="11" fill="none" stroke="#A2DCF5" stroke-width="1.5" opacity=".6"/>
    <text x="56" y="131" font-size="10" fill="#A2DCF5" opacity=".85">214-day streak</text>

    <!-- autoplaying video -->
    <rect x="44" y="148" width="192" height="104" rx="6" fill="#A2DCF5" opacity=".1"/>
    <path d="M132 186l22 14-22 14Z" fill="none" stroke="#A2DCF5" stroke-width="2" stroke-linejoin="round" opacity=".6"/>
    <path d="M52 240h176" stroke="#A2DCF5" stroke-width="3" stroke-linecap="round" opacity=".25"/>
    <path d="M52 240h132" stroke="#A2DCF5" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <text x="44" y="270" font-size="10" fill="#A2DCF5" opacity=".75">Next video in 3…</text>

    <!-- post -->
    <circle cx="56" cy="296" r="10" fill="none" stroke="#A2DCF5" stroke-width="1.5" opacity=".6"/>
    <path d="M74 292h80M74 302h48" stroke="#A2DCF5" stroke-width="3" stroke-linecap="round" opacity=".3"/>
    <rect x="44" y="316" width="192" height="92" rx="6" fill="#A2DCF5" opacity=".1"/>
    <text x="44" y="426" font-size="10" fill="#A2DCF5" opacity=".75">1,284 likes · 312 comments</text>
    <rect x="44" y="438" width="192" height="14" rx="4" fill="#A2DCF5" opacity=".07"/>

    <!-- the feed keeps going past the phone -->
    <rect x="44" y="472" width="192" height="18" rx="4" fill="#A2DCF5" opacity=".07"/>
    <rect x="44" y="498" width="192" height="12" rx="4" fill="#A2DCF5" opacity=".035"/>

    <!-- callouts -->
    <g fill="none" stroke="#A2DCF5" stroke-width="1.25" opacity=".55">
      <path d="M236 86H300"/>
      <path d="M148 127L250 127 300 152"/>
      <path d="M236 200L250 200 300 218"/>
      <path d="M200 422L250 422 300 410"/>
      <path d="M140 504L250 504 300 490"/>
    </g>
    <g fill="#A2DCF5" opacity=".8">
      <circle cx="236" cy="86" r="3"/><circle cx="148" cy="127" r="3"/><circle cx="236" cy="200" r="3"/>
      <circle cx="200" cy="422" r="3"/><circle cx="140" cy="504" r="3"/>
    </g>
    <g fill="#A2DCF5">
      <text x="308" y="84" font-size="12" font-weight="700" letter-spacing="1.5">PUSH NOTIFICATIONS</text>
      <text x="308" y="100" font-size="11" opacity=".7">Alerts at any hour</text>
      <text x="308" y="150" font-size="12" font-weight="700" letter-spacing="1.5">STREAKS</text>
      <text x="308" y="166" font-size="11" opacity=".7">Lost if you miss a day</text>
      <text x="308" y="216" font-size="12" font-weight="700" letter-spacing="1.5">AUTOPLAY</text>
      <text x="308" y="232" font-size="11" opacity=".7">The next video starts on its own</text>
      <text x="308" y="408" font-size="12" font-weight="700" letter-spacing="1.5">LIKE COUNTS</text>
      <text x="308" y="424" font-size="11" opacity=".7">Approval, as a public number</text>
      <text x="308" y="488" font-size="12" font-weight="700" letter-spacing="1.5">INFINITE SCROLL</text>
      <text x="308" y="504" font-size="11" opacity=".7">No end to the feed</text>
    </g>

    <!-- exhibit tag -->
    <rect x="308" y="296" width="128" height="34" rx="3" fill="none" stroke="#A2DCF5" stroke-width="1.5" opacity=".6"/>
    <text x="372" y="318" font-size="13" font-weight="700" letter-spacing="4" text-anchor="middle" fill="#A2DCF5" opacity=".75">EXHIBIT</text>
  </g>
</svg>
